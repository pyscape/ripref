name: Release

# Tag-driven: pushing a v-prefixed tag (v0.0.1, v1.2.3) starts a release build
# and attaches an archive per platform to a draft GitHub release.
on:
  push:
    tags: ['v*']

# softprops/action-gh-release needs write access to create the draft release.
permissions:
  contents: write

jobs:
  # Same three runners as the `rust` job in ci.yml. Keep the two lists in sync:
  # a platform that gates PRs must also be a platform we can ship from.
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Package archive
        # tar on Unix, zip (via the preinstalled 7z) on Windows. Named
        # rr-<version>-<target> so the three platform archives don't collide.
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          target=$(rustc -vV | sed -n 's/host: //p')
          name="rr-${version}-${target}"
          mkdir "$name"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/rr.exe "$name/"
            7z a "$name.zip" "$name" >/dev/null
          else
            cp target/release/rr "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.os }}
          path: |
            rr-*.tar.gz
            rr-*.zip
          if-no-files-found: ignore

  # One release job, not one per matrix job: action-gh-release creates the
  # draft on its first call, and a draft has no tag ref for a second
  # concurrent call to find, so three parallel callers can duplicate or race.
  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Attach to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/rr-*.tar.gz
            dist/rr-*.zip
